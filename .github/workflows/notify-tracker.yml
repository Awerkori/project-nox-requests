name: Notificar Tracker de Alterações em Issues

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions: {}

jobs:
  notify-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Validar credencial e disparar repository_dispatch no Tracker
        env:
          DISPATCH_TOKEN: ${{ secrets.TRACKER_DISPATCH_TOKEN }}
        run: |
          set -e
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::O segredo TRACKER_DISPATCH_TOKEN não está configurado em project-nox-requests. O evento de sincronização não pôde ser despachado."
            exit 1
          fi

          echo "Disparando repository_dispatch (event_type: issues-updated) para Awerkori/project-nox-tracker..."

          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Awerkori/project-nox-tracker/dispatches \
            -d "{\"event_type\":\"issues-updated\",\"client_payload\":{\"issue\":\"${{ github.event.issue.number || 'manual' }}\",\"action\":\"${{ github.event.action || 'workflow_dispatch' }}\"}}")

          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "::error::Falha no repository_dispatch. Código HTTP: $HTTP_STATUS"
            cat /tmp/dispatch_response.txt
            exit 1
          fi

          echo "Sucesso: repository_dispatch enviado ao Project Nox Tracker (HTTP $HTTP_STATUS)."
