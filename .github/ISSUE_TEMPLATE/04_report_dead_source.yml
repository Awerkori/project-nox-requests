name: "💀 Fonte indisponível"
description: "Reportar uma fonte permanentemente inoperante, descontinuada ou encerrada."
labels: ["Fonte indisponível"]
body:
  - type: dropdown
    id: type
    attributes:
      label: "Tipo de extensão"
      options:
        - "Mangá"
        - "Anime"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: "Nome da extensão"
      placeholder: "Ex.: SukiMangas, MangaLivre.lat"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "O que aconteceu?"
      description: "Verifique se o site realmente encerrou ou se é uma instabilidade temporária."
      placeholder: "Ex.: O domínio expirou há semanas e os responsáveis confirmaram o encerramento das atividades."
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Informações complementares (opcional)"
      placeholder: "Links de comunicados oficiais, prints ou detalhes adicionais, se houver."
    validations:
      required: false
