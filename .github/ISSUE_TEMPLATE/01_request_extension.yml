name: "🌐 Nova extensão"
description: "Solicitar a inclusão de uma nova fonte de Mangá ou Anime no Project Nox."
labels: ["Nova extensão"]
body:
  - type: dropdown
    id: type
    attributes:
      label: "Tipo de extensão"
      options:
        - "Mangá"
        - "Anime"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: "Nome da fonte"
      placeholder: "Ex.: SukiMangas"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: "URL do site"
      placeholder: "https://exemplo.com.br"
    validations:
      required: true

  - type: input
    id: lang
    attributes:
      label: "Idioma"
      placeholder: "Ex.: Português (Brasil)"
      value: "Português (Brasil)"
    validations:
      required: true

  - type: dropdown
    id: login
    attributes:
      label: "Precisa de login?"
      options:
        - "Não"
        - "Sim"
    validations:
      required: true

  - type: dropdown
    id: vip
    attributes:
      label: "Precisa de VIP/Premium?"
      options:
        - "Não"
        - "Sim"
        - "Parcialmente"
    validations:
      required: true

  - type: dropdown
    id: nsfw
    attributes:
      label: "Conteúdo +18?"
      options:
        - "Não"
        - "Sim"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Observações (opcional)"
      placeholder: "Informações adicionais sobre o site, se houver."
    validations:
      required: false
