name: "✨ Sugestão de melhoria"
description: "Propor novas funcionalidades, melhorias no ecossistema ou ideias para extensões."
labels: ["Sugestão"]
body:
  - type: input
    id: summary
    attributes:
      label: "Título ou resumo"
      placeholder: "Ex.: Adicionar suporte a filtro por ano de lançamento no catálogo"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Descrição da melhoria"
      description: "Explique a melhoria proposta e por que ela seria útil."
      placeholder: "Descreva a nova funcionalidade, como ela deve funcionar e seus benefícios."
    validations:
      required: true

  - type: input
    id: related_extension
    attributes:
      label: "Extensão relacionada (opcional)"
      placeholder: "Ex.: SukiMangas (deixe em branco se for geral do Project Nox)"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "Informações complementares (opcional)"
      placeholder: "Exemplos de outros aplicativos, conceitos visuais ou referências."
    validations:
      required: false
