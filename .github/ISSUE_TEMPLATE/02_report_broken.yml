name: "🐛 Extensão com problema"
description: "Reportar falhas em uma extensão existente (capítulos, catálogo, leitor, vídeos, etc.)."
labels: ["Problema na extensão"]
body:
  - type: dropdown
    id: type
    attributes:
      label: "Tipo de extensão"
      options:
        - "Mangá"
        - "Anime"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: "Nome da extensão"
      placeholder: "Ex.: MangaLivre.lat, ManHQ"
    validations:
      required: true

  - type: input
    id: extension_version
    attributes:
      label: "Versão da extensão"
      placeholder: "Ex.: 1.6.60"
    validations:
      required: true

  - type: input
    id: app_name
    attributes:
      label: "Aplicativo utilizado"
      placeholder: "Ex.: Mihon, Aniyomi, Komikku, Suwayomi..."
    validations:
      required: true

  - type: dropdown
    id: affected_part
    attributes:
      label: "Parte afetada"
      options:
        - "Popular / Recentes"
        - "Busca / Filtros"
        - "Metadados"
        - "Capítulos"
        - "Leitor / Imagens"
        - "Episódios / Vídeo"
        - "Instalação / Atualização"
        - "Login"
        - "Outro"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "O que está acontecendo?"
      placeholder: "Descreva o erro e o que deveria acontecer."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Como reproduzir?"
      placeholder: "Ex.: Abrir a extensão → selecionar uma obra → abrir o capítulo → erro."
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: "Informações complementares (opcional)"
      description: "Inclua links, erros ou capturas de tela, se necessário."
      placeholder: "Mensagens de erro, URLs afetadas, modelo do aparelho ou capturas de tela."
    validations:
      required: false
