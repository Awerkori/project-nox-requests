name: "🔄 Mudança de domínio"
description: "Informar quando o endereço web oficial de uma extensão existente mudou de URL."
labels: ["Mudança de domínio"]
body:
  - type: markdown
    attributes:
      value: "### 📌 Identificação da extensão"

  - type: dropdown
    id: type
    attributes:
      label: "Tipo de extensão"
      description: "Selecione se a extensão é de leitura de Mangás ou streaming de Animes."
      options:
        - "Mangá"
        - "Anime"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: "Nome da extensão"
      description: "Nome exato da extensão como exibido no aplicativo."
      placeholder: "Ex.: SukiMangas, MangaLivre.lat, etc."
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 🔄 Endereços oficiais"

  - type: input
    id: old_url
    attributes:
      label: "Domínio ou URL antigo"
      description: "Endereço anterior que deixou de responder ou foi redirecionado."
      placeholder: "Ex.: https://antigo.exemplo.com"
    validations:
      required: true

  - type: input
    id: new_url
    attributes:
      label: "Novo domínio ou URL oficial"
      description: "Novo endereço web oficial divulgado pelos responsáveis da fonte."
      placeholder: "Ex.: https://novo.exemplo.com"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 📝 Informações adicionais"

  - type: input
    id: extension_version
    attributes:
      label: "Versão instalada da extensão (opcional)"
      description: "Versão atualmente instalada no seu app, se souber."
      placeholder: "Ex.: 1.6.0"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: "Observações adicionais (opcional)"
      description: "Link de anúncio oficial (Discord, Telegram ou redes sociais da fonte), se houver."
      placeholder: "Ex.: O anúncio da mudança foi publicado no Discord oficial da scan."
    validations:
      required: false
