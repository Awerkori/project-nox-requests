name: "🔄 Mudança de domínio"
description: "Informar quando o endereço web oficial de uma extensão existente mudou de URL."
labels: ["Mudança de domínio"]
body:
  - type: dropdown
    id: type
    attributes:
      label: "Tipo de extensão"
      options:
        - "Mangá"
        - "Anime"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: "Nome da extensão"
      placeholder: "Ex.: SukiMangas, MangaLivre.lat"
    validations:
      required: true

  - type: input
    id: old_url
    attributes:
      label: "URL antiga"
      placeholder: "Ex.: https://antigo.exemplo.com"
    validations:
      required: true

  - type: input
    id: new_url
    attributes:
      label: "URL nova"
      placeholder: "Ex.: https://novo.exemplo.com"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Observações (opcional)"
      placeholder: "Link do anúncio oficial ou detalhes adicionais, se houver."
    validations:
      required: false
